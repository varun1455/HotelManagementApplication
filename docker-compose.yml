services:
  postgres:
    image: postgres:16-alpine
    container_name: stayease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayease-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CALENDAR_API_KEY: ${CALENDAR_API_KEY}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED}
      SEED_SYSTEM_ADMIN_EMAIL: ${SEED_SYSTEM_ADMIN_EMAIL}
      SEED_SYSTEM_ADMIN_PASSWORD: ${SEED_SYSTEM_ADMIN_PASSWORD}
      SEED_HOTEL_MANAGER_1_EMAIL: ${SEED_HOTEL_MANAGER_1_EMAIL}
      SEED_HOTEL_MANAGER_1_PASSWORD: ${SEED_HOTEL_MANAGER_1_PASSWORD}
      SEED_HOTEL_MANAGER_2_EMAIL: ${SEED_HOTEL_MANAGER_2_EMAIL}
      SEED_HOTEL_MANAGER_2_PASSWORD: ${SEED_HOTEL_MANAGER_2_PASSWORD}
      SEED_HOTEL_MANAGER_3_EMAIL: ${SEED_HOTEL_MANAGER_3_EMAIL}
      SEED_HOTEL_MANAGER_3_PASSWORD: ${SEED_HOTEL_MANAGER_3_PASSWORD}
      DEFAULT_SURGE_FACTOR: ${DEFAULT_SURGE_FACTOR}
      DEFAULT_URGENCY_DAYS_THRESHOLD: ${DEFAULT_URGENCY_DAYS_THRESHOLD}
      DEFAULT_URGENCY_FACTOR: ${DEFAULT_URGENCY_FACTOR}
      DEFAULT_OCCUPANCY_THRESHOLD: ${DEFAULT_OCCUPANCY_THRESHOLD}
      DEFAULT_OCCUPANCY_FACTOR: ${DEFAULT_OCCUPANCY_FACTOR}
      HOLIDAY_NATIONAL_FACTOR: ${HOLIDAY_NATIONAL_FACTOR}
      HOLIDAY_OPTIONAL_FACTOR: ${HOLIDAY_OPTIONAL_FACTOR}
      HOLIDAY_RELIGIOUS_FACTOR: ${HOLIDAY_RELIGIOUS_FACTOR}
      HOLIDAY_LOCAL_FACTOR: ${HOLIDAY_LOCAL_FACTOR}
      HOLIDAY_OBSERVANCE_FACTOR: ${HOLIDAY_OBSERVANCE_FACTOR}

volumes:
  postgres_data:
