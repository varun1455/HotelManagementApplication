spring.application.name=stayEase
server.port=8080

#DB Configuration
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = true

#api-path
server.servlet.context-path=/api/v1  

#Jwt Config
jwt.secretKey = ${JWT_SECRET_KEY}
jwt.accessTokenExpiration= ${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refreshTokenExpiration= ${JWT_REFRESH_TOKEN_EXPIRATION}

frontend.url = ${FRONTEND_URL}

#stripe integration
stripe.secret.key = ${STRIPE_SECRET_KEY}
stripe.webhook.secret = ${STRIPE_WEBHOOK_SECRET}

#finding all Holidays
calendarific.api.key = ${CALENDAR_API_KEY}
calendarific.host.url = https://calendarific.com/api/v2

#default data addition
spring.config.import=classpath:systemDataSeeder.yml

#Db Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#heath Check
management.endpoints.web.exposure.include=health
